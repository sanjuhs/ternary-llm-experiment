[project]
name = "ternary-llm-experiment"
version = "0.2.0"
description = "Controlled TinyStories experiments with ternary transformer weights and activations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=3.2,<5",
    "numpy>=2.0,<3",
    "tokenizers>=0.20,<1",
    "torch>=2.8,<2.9",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
reference = [
    "transformers>=4.48,<5",
]

[project.scripts]
ternary-data = "ternary_llm.data:main"
ternary-train = "ternary_llm.train:main"
ternary-evaluate = "ternary_llm.evaluate:main"
ternary-generate = "ternary_llm.generate:main"
ternary-report = "ternary_llm.report:main"
ternary-packed-benchmark = "ternary_llm.packed:main"
ternary-diagnostics = "ternary_llm.diagnostics:main"
ternary-triton-benchmark = "ternary_llm.packed_triton:main"
ternary-export = "ternary_llm.export:main"
ternary-calibrate-projection = "ternary_llm.calibrate_projection:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ternary_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
