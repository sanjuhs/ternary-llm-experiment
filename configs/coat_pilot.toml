seed = 17
mode = "coat_a4"
device = "cuda"

[model]
vocab_size = 4096
context_length = 256
d_model = 256
n_layers = 6
n_heads = 8
ff_multiplier = 4
dropout = 0.0
activation_threshold = 0.5
weight_threshold = 0.5

[data]
train_bin = "data/pilot/train.bin"
validation_bin = "data/pilot/validation.bin"
tokenizer = "data/pilot/tokenizer.json"

[train]
batch_size = 64
max_steps = 1000
learning_rate = 0.00003
min_learning_rate = 0.000003
warmup_steps = 100
weight_decay = 0.0
grad_clip = 1.0
eval_interval = 250
eval_batches = 100
checkpoint_interval = 250
output_dir = "artifacts/coat-pilot"
log_interval = 20
precision = "bf16"
