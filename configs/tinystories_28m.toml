seed = 17
mode = "float"
device = "cuda"

[model]
vocab_size = 4096
context_length = 256
d_model = 512
n_layers = 8
n_heads = 8
ff_multiplier = 4
dropout = 0.0
activation_threshold = 0.5
activation_levels = 7
activation_encoding = "uniform"
activation_planes = 1
weight_threshold = 0.5
attention_quantization = "float"
attention_clip = 3.0
attention_threshold = 0.125
qkv_quantization = "inherit"
attention_rectification = "none"
attention_gate = "none"
attention_gate_initial = 0.9
feed_forward_activation = "gelu"

[data]
train_bin = "data/full/train.bin"
validation_bin = "data/full/validation.bin"
tokenizer = "data/full/tokenizer.json"

[train]
batch_size = 32
max_steps = 119184
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 2000
weight_decay = 0.1
grad_clip = 1.0
eval_interval = 2000
eval_batches = 100
checkpoint_interval = 5000
output_dir = "artifacts/tinystories-28m"
log_interval = 50
precision = "bf16"
logit_distillation_weight = 0.0
attention_distillation_weight = 0.0
qk_distillation_weight = 0.0
hidden_distillation_weight = 0.0
distillation_temperature = 1.0
distillation_token_stride = 4
